<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #0f172a;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    textarea {
      width: 100%;
      height: 80px;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 10px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #4338ca;
    }
    #res-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .fake {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .reliable {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
  </style>
</head>
<body>
  <h3>🛡️ InfoShield Scanner</h3>
  <textarea id="popup-input" placeholder="Paste statement or highlight text on page..."></textarea>
  <button id="popup-scan-btn">Scan Authenticity</button>
  <div id="res-box"></div>

  <script src="popup.js"></script>
</body>
</html>
